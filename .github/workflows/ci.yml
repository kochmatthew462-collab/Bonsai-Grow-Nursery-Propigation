name: CI

# Tests ran only by hand until this workflow existed. Every step here is
# offline by design: no network, no keys, no credentials.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tracker syntax check + Pi monitor tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # pi/test_pi.py runs the real js/store.js under node to prove the Python
      # and JavaScript merges agree, so Node is needed for both steps.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A syntax error in the tracker's front end once took out the whole UI
      # with nothing noticing (9b4000a). node --check is what catches it.
      # Looped because node --check takes one file at a time.
      - name: Syntax-check the tracker scripts
        run: |
          shopt -s nullglob
          files=(js/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No files matched js/*.js — expected the tracker scripts here."
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "node --check $f"
            node --check "$f"
          done
        shell: bash

      # The Pi installs requests from apt (pi/install.sh); here it comes from pip.
      - name: Install the Pi monitor's dependency
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run the Pi monitor tests (offline, no hardware)
        run: python3 pi/test_pi.py
